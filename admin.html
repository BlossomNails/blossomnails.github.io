<!doctype html>
<html lang="es-PY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel · Blossom Beauty Salon</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fbf3f5">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="admin.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    try {
      var t = localStorage.getItem("blossom-theme");
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 0c.6 9.4 2.6 11.4 12 12-9.4.6-11.4 2.6-12 12-.6-9.4-2.6-11.4-12-12 9.4-.6 11.4-2.6 12-12z"/></symbol>
  <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm0 18.15c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24 4.54 0 8.24 3.7 8.24 8.24 0 4.55-3.7 8.24-8.23 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.16.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.11-.22-.17-.47-.29z"/></symbol>
</svg>

<!-- sign in -->
<main class="login" id="login" hidden>
  <form class="login-card" id="login-form">
    <img src="images/logo-512.png" alt="" width="84" height="84">
    <h1>Panel de <em>Blossom</em></h1>
    <p class="muted">Tu agenda, tus clientas y tus servicios.</p>
    <label class="lbl" for="l-email">Email</label>
    <input class="field" id="l-email" type="email" autocomplete="username" required>
    <label class="lbl" for="l-pass">Contraseña</label>
    <input class="field" id="l-pass" type="password" autocomplete="current-password" required>
    <p class="form-error" id="l-error" role="alert" hidden></p>
    <button class="btn btn-rose wide" type="submit">Entrar</button>
    <p class="demo-note" id="l-demo" hidden>Modo demo: entrá con cualquier email y contraseña. Los datos quedan guardados solo en este navegador.</p>
    <a class="muted small" href="./">← Volver a la página de reservas</a>
  </form>
</main>

<!-- panel -->
<div class="shell" id="app" hidden>
  <header class="topbar">
    <a class="brand" href="#/inicio"><img src="images/logo-512.png" alt="" width="34" height="34">Blossom <small>Panel</small></a>
    <span class="demo-badge" id="demo-badge" hidden title="Los datos quedan solo en este navegador">Modo demo</span>
    <button class="icon-btn sm" type="button" data-act="reload" aria-label="Actualizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
    </button>
    <button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Modo oscuro">
      <span class="tt-thumb" aria-hidden="true">
        <svg class="tt-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
        <svg class="tt-moon" viewBox="0 0 24 24"><path d="M20 14.6A8 8 0 0 1 9.4 4a8 8 0 1 0 10.6 10.6z"/></svg>
      </span>
    </button>
  </header>
  <nav class="sidenav" id="sidenav" aria-label="Secciones"></nav>
  <main class="view" id="view" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
</div>

<div class="sheet-backdrop dlg-backdrop" id="dlg-backdrop"></div>
<section class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title" aria-hidden="true" inert>
  <div class="grab" aria-hidden="true"></div>
  <div class="dlg-head">
    <h2 id="dlg-title"></h2>
    <button class="close" type="button" data-act="dlg-close" aria-label="Cerrar">×</button>
  </div>
  <div class="dlg-body" id="dlg-body"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="core.js"></script>
<script src="admin.js"></script>
</body>
</html>
